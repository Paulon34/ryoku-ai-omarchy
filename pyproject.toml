[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ryoku-ai-omarchy"
version = "0.5.1"
description = "Lightweight, privacy-first AI assistant foundation for Omarchy / Arch Linux"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ryoku contributors"}]
dependencies = []

[project.optional-dependencies]
# Login/chat also require Node.js 22+ and `npm install` inside siwc_bridge/.
siwc = []
pdf = ["pypdf>=5.0"]


[project.scripts]
ryoku = "ryoku_ai.cli:run"

[tool.setuptools.packages.find]
where = ["src"]
