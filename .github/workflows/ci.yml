name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CLI
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke test
        run: |
          ryoku --version
          ryoku doctor --json
          ryoku status
      - name: Compile
        run: python -m compileall -q src tests
