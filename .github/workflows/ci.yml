name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System libs for keytar build
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Install CLI
        run: python -m pip install -e .
      - name: Install SIWC bridge
        run: |
          cd siwc_bridge
          npm install
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke test
        run: |
          ryoku --version
          ryoku doctor --json
          ryoku status
          ryoku chat || test $? -eq 3
          ryoku history --help
          ryoku dictation capabilities --json || true
          ryoku dictation --help
          ryoku vision capabilities --json
          ryoku vision --help
          test -f plugins/io.github.paulon34.ryoku-ai/manifest.json
          python -c "import json; json.load(open('plugins/io.github.paulon34.ryoku-ai/manifest.json'))"
          python -c "import json; json.load(open('plugins/io.github.paulon34.ryoku-ai/i18n/pt-BR.json'))"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Typecheck vendor SDK
        run: npm run build --prefix vendor/siwc-local
      - name: Plugin contract
        run: |
          test -f plugins/io.github.paulon34.ryoku-ai/BarWidget.qml
          test -f plugins/io.github.paulon34.ryoku-ai/Panel.qml
          ! grep -iE 'access_token|refresh_token' plugins/io.github.paulon34.ryoku-ai/*.qml
          grep -q startDictation plugins/io.github.paulon34.ryoku-ai/Panel.qml
          grep -q 'dictation capabilities' docs/DICTATION.md
          grep -q abortFailedSend plugins/io.github.paulon34.ryoku-ai/Panel.qml
          test -f docs/VISION.md
      - name: QML lint (optional)
        run: |
          if command -v qmllint >/dev/null; then
            qmllint plugins/io.github.paulon34.ryoku-ai/*.qml || true
          else
            echo "qmllint not installed on runner; skipped"
          fi

