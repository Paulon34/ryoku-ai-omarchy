name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System libs for keytar build
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Install CLI
        run: python -m pip install -e .
      - name: Install SIWC bridge
        run: |
          cd siwc_bridge
          npm install
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke test
        run: |
          ryoku --version
          ryoku doctor --json
          ryoku status
          ryoku chat || test $? -eq 3
      - name: Compile
        run: python -m compileall -q src tests
      - name: Typecheck vendor SDK
        run: npm run build --prefix vendor/siwc-local
